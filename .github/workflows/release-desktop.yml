name: Release desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify release metadata
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          expected_tag="v${version}"

          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(beta|rc)\.[1-9][0-9]*)?$ ]]; then
            echo "Tag must look like v1.2.3, v1.2.3-beta.1, or v1.2.3-rc.1" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag must point to a commit contained in origin/main" >&2
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            is_prerelease=true
          else
            is_prerelease=false
          fi

          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$is_prerelease" >> "$GITHUB_ENV"

      - run: npm ci

      - run: npm run check

      - name: Import Apple signing certificate
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        run: |
          certificate_path="$RUNNER_TEMP/agent-office.p12"
          keychain_path="$RUNNER_TEMP/agent-office-signing.keychain-db"
          keychain_password="agent-office-actions"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db

      - name: Build Apple Silicon artifacts
        run: npm run make -- --arch=arm64

      - name: Build Intel artifacts
        run: npm run make -- --arch=x64

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-assets

          for arch in arm64 x64; do
            dmg="out/make/dmg/${arch}/Agent Office-${RELEASE_VERSION}-${arch}.dmg"
            zip="out/make/zip/darwin/${arch}/Agent Office-darwin-${arch}-${RELEASE_VERSION}.zip"
            test -f "$dmg"
            test -f "$zip"
            cp "$dmg" "release-assets/Agent-Office-${RELEASE_VERSION}-macos-${arch}.dmg"
            cp "$zip" "release-assets/Agent-Office-${RELEASE_VERSION}-macos-${arch}.zip"
          done

          (cd release-assets && shasum -a 256 Agent-Office-* > SHA256SUMS.txt)
          ls -lh release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            args=(
              release create "$RELEASE_TAG" release-assets/*
              --draft
              --generate-notes
              --title "Agent Office $RELEASE_TAG"
              --verify-tag
            )
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi
